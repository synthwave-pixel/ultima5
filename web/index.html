<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ultima V</title>
    <!-- What a shared link shows: the description, and the box's painting with the title (docs/banner.png fitted to
         1200 by 630, its padding above: public/share.jpg). The page's address is GitHub Pages' (pages.yml). -->
    <meta
      name="description"
      content="Ultima V: Warriors of Destiny on a new engine, for the browser, the desktop, the Steam Deck and Android. Like OpenMW for Morrowind, it ships none of the 1988 game: it plays your own copy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ultima V" />
    <meta property="og:title" content="Ultima V: Warriors of Destiny" />
    <meta
      property="og:description"
      content="The 1988 RPG on a new engine, for the browser, the desktop, the Steam Deck and Android: a modern look or the original, controller and touch, and your own copy of the game."
    />
    <meta property="og:url" content="https://synthwave-pixel.github.io/ultima5/" />
    <meta property="og:image" content="https://synthwave-pixel.github.io/ultima5/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ultima V: Warriors of Destiny, 1988 to 2026 - the Avatar standing over his fallen friend, three Shadowlords looming over them, from the box's painting"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      @media (aspect-ratio < 1 / 1) {
        body {
          align-items: flex-start;
        }
      }
      canvas {
        /* Its own pixels are the display's (screen.ts sizes it to them and scales the game into them). */
        image-rendering: auto;
        /* 320 by 200 at the DOS game's shape: 16:10 as drawn. The EGA monitor
           stretched it to 4:3; square pixels are the modern choice. */
        width: min(100vw, calc(100vh * 16 / 10));
        width: min(100dvw, calc(100dvh * 16 / 10));
        aspect-ratio: 16 / 10;
        outline: none;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="200" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
