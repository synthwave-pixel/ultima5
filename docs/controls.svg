<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 949 551" width="949" height="551" role="img" aria-label="The keyboard read as a controller: WASD or the arrows are the d-pad; Enter or Z is A; Space, Escape, X or B is B; Q, / or C is X (attack); E, full stop, V or Y is Y (cast). Escape at the command prompt opens the Pause menu.">
<style>
.cap { font: 600 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #c9ced6; }
.btn { font: 700 20px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
.title { font: 700 22px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #eef1f5; }
.hand { font: 600 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #9aa1ab; letter-spacing: 0.04em; }
.note { font: 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #9aa1ab; }
.leg { font: 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #d6dae0; }
.leg-b { font: 700 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #111; }
</style>
<rect width="949" height="551" rx="14" fill="#16181d"/>
<text x="40" y="52" class="title">The keyboard as a controller</text>
<text x="909" y="52" class="note" text-anchor="end">Settings: Input - Controller. One hand or two.</text>
<rect x="40" y="96" width="58" height="58" rx="8" fill="#2b2f36" stroke="#d9423c" stroke-width="3"/>
<text x="50" y="116" class="cap">Esc</text>
<text x="69" y="142" class="btn" fill="#d9423c" text-anchor="middle">B</text>
<text x="110" y="122" class="note">B - and the Pause menu,</text><text x="110" y="140" class="note">at the command prompt</text>
<text x="66" y="173" class="hand">Left hand</text>
<rect x="66" y="185" width="58" height="58" rx="8" fill="#2b2f36" stroke="#3b7fd4" stroke-width="3"/>
<text x="76" y="205" class="cap">Q</text>
<text x="95" y="231" class="btn" fill="#3b7fd4" text-anchor="middle">X</text>
<rect x="132" y="185" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="142" y="205" class="cap">W</text>
<text x="161" y="231" class="btn" fill="#8a8f98" text-anchor="middle">▲</text>
<rect x="198" y="185" width="58" height="58" rx="8" fill="#2b2f36" stroke="#e8b923" stroke-width="3"/>
<text x="208" y="205" class="cap">E</text>
<text x="227" y="231" class="btn" fill="#e8b923" text-anchor="middle">Y</text>
<rect x="86" y="251" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="96" y="271" class="cap">A</text>
<text x="115" y="297" class="btn" fill="#8a8f98" text-anchor="middle">◀</text>
<rect x="152" y="251" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="162" y="271" class="cap">S</text>
<text x="181" y="297" class="btn" fill="#8a8f98" text-anchor="middle">▼</text>
<rect x="218" y="251" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="228" y="271" class="cap">D</text>
<text x="247" y="297" class="btn" fill="#8a8f98" text-anchor="middle">▶</text>
<rect x="106" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#3fae49" stroke-width="3"/>
<text x="116" y="337" class="cap">Z</text>
<text x="135" y="363" class="btn" fill="#3fae49" text-anchor="middle">A</text>
<rect x="172" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#d9423c" stroke-width="3"/>
<text x="182" y="337" class="cap">X</text>
<text x="201" y="363" class="btn" fill="#d9423c" text-anchor="middle">B</text>
<rect x="238" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#3b7fd4" stroke-width="3"/>
<text x="248" y="337" class="cap">C</text>
<text x="267" y="363" class="btn" fill="#3b7fd4" text-anchor="middle">X</text>
<rect x="304" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#e8b923" stroke-width="3"/>
<text x="314" y="337" class="cap">V</text>
<text x="333" y="363" class="btn" fill="#e8b923" text-anchor="middle">Y</text>
<rect x="139" y="383" width="256" height="58" rx="8" fill="#2b2f36" stroke="#d9423c" stroke-width="3"/>
<text x="149" y="403" class="cap">Space</text>
<text x="267" y="429" class="btn" fill="#d9423c" text-anchor="middle">B</text>
<text x="560" y="173" class="hand">Right hand</text>
<rect x="580" y="251" width="98" height="58" rx="8" fill="#2b2f36" stroke="#3fae49" stroke-width="3"/>
<text x="590" y="271" class="cap">Enter</text>
<text x="629" y="297" class="btn" fill="#3fae49" text-anchor="middle">A</text>
<rect x="560" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#e8b923" stroke-width="3"/>
<text x="570" y="337" class="cap">.</text>
<text x="589" y="363" class="btn" fill="#e8b923" text-anchor="middle">Y</text>
<rect x="626" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#3b7fd4" stroke-width="3"/>
<text x="636" y="337" class="cap">/</text>
<text x="655" y="363" class="btn" fill="#3b7fd4" text-anchor="middle">X</text>
<rect x="778" y="317" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="788" y="337" class="cap">↑</text>
<text x="807" y="363" class="btn" fill="#8a8f98" text-anchor="middle">▲</text>
<rect x="712" y="383" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="722" y="403" class="cap">←</text>
<text x="741" y="429" class="btn" fill="#8a8f98" text-anchor="middle">◀</text>
<rect x="778" y="383" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="788" y="403" class="cap">↓</text>
<text x="807" y="429" class="btn" fill="#8a8f98" text-anchor="middle">▼</text>
<rect x="844" y="383" width="58" height="58" rx="8" fill="#2b2f36" stroke="#8a8f98" stroke-width="3"/>
<text x="854" y="403" class="cap">→</text>
<text x="873" y="429" class="btn" fill="#8a8f98" text-anchor="middle">▶</text>
<circle cx="51" cy="488" r="11" fill="#3fae49"/><text x="51" y="493" class="leg-b" text-anchor="middle">A</text><text x="70" y="493" class="leg">choose - the command menu</text>
<circle cx="315" cy="488" r="11" fill="#d9423c"/><text x="315" y="493" class="leg-b" text-anchor="middle">B</text><text x="334" y="493" class="leg">back out - pass</text>
<circle cx="497" cy="488" r="11" fill="#3b7fd4"/><text x="497" y="493" class="leg-b" text-anchor="middle">X</text><text x="516" y="493" class="leg">attack - fire, aboard a ship</text>
<circle cx="786" cy="488" r="11" fill="#e8b923"/><text x="786" y="493" class="leg-b" text-anchor="middle">Y</text><text x="805" y="493" class="leg">cast</text>
<text x="40" y="529" class="note">Start or Select - on a gamepad, or the touch pad's pause - opens the Pause menu wherever the game waits.</text>
</svg>
